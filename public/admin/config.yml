local_backend: true
backend:
  name: github
  repo: abbradshaw/kubina-art
  branch: main
  auth_endpoint: /api/auth

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

collections:
  - name: "work"
    label: "Artworks"
    folder: "src/content/work"
    create: true
    slug: "{{year}}-{{slug}}"
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Main Image"
        name: "image"
        widget: "image"
        hint: "Upload the artwork here. Astro will optimize it automatically."
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Painting", "Drawing", "Sculpture", "Digital"]
        default: "Painting"
      - label: "Availability Status"
        name: "status"
        widget: "select"
        options: ["Available", "Private Collection", "Sold", "Museum Collection"]
        default: "Available"
      - label: "Year Created"
        name: "year"
        widget: "string"
        pattern: ['^[0-9]{4}$', "Must be a 4-digit year"]
      - label: "Medium"
        name: "medium"
        widget: "string"
        hint: "e.g., Oil on Canvas, Charcoal, Bronze"
      - label: "Dimensions"
        name: "dimensions"
        widget: "string"
        required: false
        hint: "e.g., 24 x 36 inches"
      - label: "Curator Notes"
        name: "body"
        widget: "markdown"
        hint: "Write the story behind this piece here."

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About the Artist"
        file: "src/content/pages/about.md"
        fields:
          - {label: "Page Title", name: "title", widget: "string", default: "About the Artist"}
          - label: "Portrait Photo"
            name: "image"
            widget: "image"
            hint: "Upload the passport/cameo photo here."
          - label: "Highlight Quote"
            name: "pull_quote"
            widget: "text"
            hint: "A short quote to display next to the photo."
          - label: "Biography Chapters"
            name: "chapters"
            widget: "list"
            summary: "{{fields.label}} - {{fields.title}}"
            fields:
              - {label: "Label (e.g., Chapter I)", name: "label", widget: "string"}
              - {label: "Chapter Title", name: "title", widget: "string"}
              - {label: "Text Content", name: "text", widget: "text"}
              - {label: "Interspersed Artwork", name: "artwork", widget: "image", required: false}
              - {label: "Artwork Caption", name: "caption", widget: "string", required: false}
